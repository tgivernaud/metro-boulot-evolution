<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Métro, Boulot, Évolution</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee9dd;color:#24453f;font:15px system-ui}header{background:#294d43;color:white;padding:15px}header strong{font:24px Georgia,serif}.stats{display:flex;gap:7px;overflow:auto;margin-top:10px}.stats span{background:#ffffff25;border-radius:8px;padding:7px;white-space:nowrap}main{max-width:800px;margin:auto;padding:12px}nav{display:flex;gap:7px}button{cursor:pointer;font:inherit;border:1px solid #cbbda6;border-radius:10px;padding:12px;background:#fffaf0;color:#24453f}nav button{flex:1;padding:10px 2px}button.active,.primary{background:#315e50;color:white}.card{background:#fffaf0;border:1px solid #e2d6c4;border-radius:14px;padding:15px;margin:12px 0}h2{font:26px Georgia,serif;margin:13px 0}h3{margin:0 0 9px}.scene{position:relative;touch-action:none;border:5px solid #fffaf0;border-radius:16px;overflow:hidden}canvas{width:100%;display:block;aspect-ratio:4/3}#joy{position:absolute;bottom:13px;left:15px;width:100px;height:100px;border:2px solid #ffffffb8;border-radius:50%;background:#365c5288;touch-action:none}#knob{position:absolute;left:27px;top:27px;width:42px;height:42px;background:#fff9e8;border-radius:50%}#act{position:absolute;right:15px;bottom:25px;width:75px;height:75px;border-radius:50%;background:#315e50e8;color:white;border:2px solid white}#hint{position:absolute;top:8px;left:8px;right:8px;text-align:center;background:#fff9e8db;padding:7px;border-radius:8px;font-size:12px}.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shop button:disabled{opacity:.5}.choice{display:block;width:100%;text-align:left;margin:7px 0}.shade{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}.shade.hidden{display:none}.dialog{background:#fffaf0;border-radius:16px;padding:20px;max-width:520px;width:100%}small{color:#718076}#log{font-size:13px}
</style></head><body><header><strong>Métro, Boulot, Évolution</strong><div class="stats" id="stats"></div></header><main><nav><button onclick="change('home')" id="home">Appartement</button><button onclick="change('office')" id="office">Bureau</button><button onclick="change('paris')" id="paris">Paris</button></nav><h2 id="title"></h2><div class="scene"><canvas id="canvas" width="800" height="600"></canvas><div id="hint"></div><div id="joy"><div id="knob"></div></div><button id="act" onclick="act()">Agir</button></div><div id="panel"></div><div class="card"><h3>Journal</h3><div id="log"></div></div><small>Sauvegarde automatique sur cet appareil. Déplacement au joystick ou aux flèches du clavier.</small></main><div id="shade" class="shade hidden"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogActions"></div></div></div>
<script>
const key='mbe-github-v1',base=()=>({money:900,energy:80,stress:20,happy:60,health:80,rep:10,skill:0,quest:0,items:[],logs:['Bienvenue à Paris !']});let s;try{s=JSON.parse(localStorage.getItem(key))||base()}catch{s=base()}let place='home',p={x:400,y:465},v={x:0,y:0},near=null,prev=0;const el=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(s)),limit=n=>Math.max(0,Math.min(100,n));const goods=[['Canapé','🛋️',250],['Plante','🪴',70],['Bureau','💻',180],['Télévision','📺',220]];const scenes={home:[['Lit','🛏️',180,195,'sleep'],['Porte','🚪',650,190,'door']],office:[['Manager','👩‍💼',180,195,'manager'],['Collègue','🧑‍💻',620,195,'colleague'],['Mentor','👨‍🏫',400,160,'mentor']],paris:[['Café','☕',180,195,'coffee'],['Atelier IA','🤖',620,195,'ai'],['Canard','🦆',400,155,'duck']]};
function objs(){let o=scenes[place].slice();if(place==='home')s.items.forEach((n,i)=>{let g=goods.find(g=>g[0]===n);o.push([n,g[1],175+i%3*210,355+Math.floor(i/3)*105,'furniture'])});return o}
function change(x){place=x;p={x:400,y:465};render()}
function render(){el('title').textContent={home:'Ton appartement',office:'Le bureau — IT Finance',paris:'Un quartier de Paris'}[place];el('stats').innerHTML=[['€',s.money+' €'],['Énergie',s.energy],['Stress',s.stress],['Bonheur',s.happy],['Santé',s.health],['Réputation',s.rep],['Compétences',s.skill]].map(a=>'<span>'+a[0]+' : '+a[1]+'</span>').join('');['home','office','paris'].forEach(x=>el(x).classList.toggle('active',x===place));el('log').textContent=s.logs.slice(-5).reverse().join(' • ');el('panel').innerHTML=place==='home'?'<div class="card"><h3>Meubler ton appartement</h3><div class="shop">'+goods.map(g=>'<button '+(s.items.includes(g[0])?'disabled':'')+' onclick="buy(\''+g[0]+'\')">'+g[1]+' '+g[0]+' — '+g[2]+' €</button>').join('')+'</div></div>':place==='office'?'<div class="card"><h3>Mission : Projet en retard</h3><p>'+['Parle au manager pour commencer.','Parle au collègue pour comprendre le retard.','Retourne voir le manager avec tes informations.','Mission terminée.'][s.quest]+'</p></div>':'<div class="card"><h3>Explorer Paris</h3><p>Approche-toi des lieux pour découvrir des activités.</p></div>';save()}
function log(t){s.logs.push(t);render()}function buy(n){let g=goods.find(g=>g[0]===n);if(s.items.includes(n))return;if(s.money<g[2])return dialog('Budget insuffisant','Tu dois gagner davantage.');s.money-=g[2];s.items.push(n);s.happy=limit(s.happy+3);log('Achat : '+n+' (-'+g[2]+' €).')}
function dialog(title,text,choices=[['Fermer',close]]){el('dialogTitle').textContent=title;el('dialogText').textContent=text;let a=el('dialogActions');a.innerHTML='';choices.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c[0];b.onclick=c[1];a.appendChild(b)});el('shade').classList.remove('hidden')}function close(){el('shade').classList.add('hidden');render()}
function act(){if(!near)return dialog('Déplacement','Approche-toi d’un objet ou d’un personnage.');let a=near[4];if(a==='sleep'){s.energy=limit(s.energy+25);s.stress=limit(s.stress-8);log('Repos : +25 énergie, -8 stress.');return dialog('Repos','Tu récupères des forces.')}if(a==='door')return dialog('Sortir','Choisis une destination.',[['Bureau',()=>{close();change('office')}],['Paris',()=>{close();change('paris')}],['Rester',close]]);if(a==='furniture')return dialog(near[0],'Ce meuble rend ton appartement plus agréable.');if(a==='manager')return manager();if(a==='colleague')return colleague();if(a==='mentor'){s.skill++;log('Conseil : présenter les faits, impacts et options.');return dialog('Mentor','Pour résoudre un blocage, expose les faits et plusieurs solutions.')}if(a==='coffee'){s.rep+=3;s.energy=limit(s.energy-6);log('Café : +3 réputation.');return dialog('Networking','Tu rencontres une personne de ton secteur.')}if(a==='ai'){s.skill+=3;s.energy=limit(s.energy-10);log('Atelier IA : +3 compétences.');return dialog('Atelier IA','Tu découvres les usages pratiques des agents IA.')}if(a==='duck'){s.money+=25;s.happy=limit(s.happy+4);log('Canard chef de projet : +25 €.');return dialog('Le canard chef de projet','Il exige un comité de pilotage. Tu factures le compte rendu 25 €.')}}
function manager(){if(s.quest===0)return dialog('La manager','Le projet est en retard. Peux-tu enquêter ?', [['Accepter',()=>{s.quest=1;s.energy=limit(s.energy-5);log('Mission acceptée.');close()}],['Plus tard',close]]);if(s.quest===1)return dialog('La manager','Commence par discuter avec ton collègue.');if(s.quest===3)return dialog('La manager','Merci pour ton travail. Mission terminée.');dialog('La manager','Une validation entre équipes a été oubliée. Que proposes-tu ?', [['Aider le collègue',()=>finish(180,8,2,15,'Tu débloques le problème, mais attention à ta charge de travail.')],['Présenter les faits et options',()=>finish(150,5,3,10,'Tu clarifies les décisions et les responsabilités.')],['Préserver tes priorités',()=>finish(80,-2,0,5,'Tu poses tes limites, mais communique clairement tes contraintes.')]])}
function colleague(){if(s.quest===0)return dialog('Collègue','Parle d’abord à la manager.');if(s.quest>=2)return dialog('Collègue','La validation entre équipes était manquante.');s.quest=2;s.skill++;log('Dépendance inter-équipes identifiée.');dialog('Collègue','Le retard vient d’une validation jamais demandée. Retourne voir la manager.')}
function finish(m,r,k,e,t){s.quest=3;s.money+=m;s.rep=Math.max(0,s.rep+r);s.skill+=k;s.energy=limit(s.energy-e);log('Mission terminée : +'+m+' €.');dialog('Bilan professionnel',t)}
const c=el('canvas'),ctx=c.getContext('2d');function frame(t){let dt=Math.min((t-prev)/16.7||1,3);prev=t;p.x=Math.max(30,Math.min(770,p.x+v.x*4*dt));p.y=Math.max(110,Math.min(545,p.y+v.y*4*dt));let wall={home:'#e8d9bf',office:'#dce8e4',paris:'#d4e2df'}[place],floor={home:'#b99b7a',office:'#a0b6b2',paris:'#9aaea9'}[place];ctx.fillStyle=wall;ctx.fillRect(0,0,800,600);ctx.fillStyle=floor;ctx.fillRect(0,300,800,300);if(place==='home'){ctx.fillStyle='#a5c9ce';ctx.fillRect(480,60,200,150);ctx.strokeStyle='#fff8eb';ctx.lineWidth=12;ctx.strokeRect(480,60,200,150)}if(place==='paris'){ctx.fillStyle='#a1b5b3';for(let i=0;i<7;i++)ctx.fillRect(i*125,65+i%3*15,105,230)}near=null;let dmin=120;for(let o of objs()){ctx.fillStyle='#fff8e7';ctx.fillRect(o[2]-55,o[3]-48,110,90);ctx.strokeStyle='#a6aa94';ctx.lineWidth=3;ctx.strokeRect(o[2]-55,o[3]-48,110,90);ctx.textAlign='center';ctx.font='46px system-ui';ctx.fillText(o[1],o[2],o[3]+15);ctx.fillStyle='#2d4b41';ctx.font='bold 15px system-ui';ctx.fillText(o[0],o[2],o[3]+66);let d=Math.hypot(p.x-o[2],p.y-o[3]);if(d<dmin){dmin=d;near=o}}ctx.fillStyle='#2f554c';ctx.fillRect(p.x-17,p.y-4,34,44);ctx.fillStyle='#e7b78e';ctx.beginPath();ctx.arc(p.x,p.y-22,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#343c42';ctx.fillRect(p.x-13,p.y+40,10,20);ctx.fillRect(p.x+4,p.y+40,10,20);ctx.fillStyle='#38332d';ctx.beginPath();ctx.arc(p.x,p.y-30,17,Math.PI,Math.PI*2);ctx.fill();el('hint').textContent=near?'Près de '+near[0]+' : touche Agir':'Déplace le personnage avec le joystick';el('act').style.opacity=near?1:.6;requestAnimationFrame(frame)}
const joy=el('joy'),knob=el('knob');function move(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),k=Math.min(1,40/(m||1));dx*=k;dy*=k;v={x:dx/40,y:dy/40};knob.style.transform='translate('+dx+'px,'+dy+'px)'}function stop(){v={x:0,y:0};knob.style.transform='translate(0,0)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))move(e)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);document.addEventListener('keydown',e=>{let keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],a:[-1,0],s:[0,1],d:[1,0]};if(keys[e.key]){e.preventDefault();v={x:keys[e.key][0],y:keys[e.key][1]}}if(e.key==='Enter'||e.key===' ')act()});document.addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key))stop()});render();requestAnimationFrame(frame);
</script></body></html>
