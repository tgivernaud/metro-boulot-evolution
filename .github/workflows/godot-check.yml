name: Godot 4 - build jouable sur iPhone
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Installer les templates d'export officiels
        run: |
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Récupérer les vrais modèles 3D
        run: |
          set -e
          BASE=https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models
          mkdir -p godot/assets/characters godot/assets/props
          curl -fL --retry 3 -o godot/assets/characters/CesiumMan.glb "$BASE/CesiumMan/glTF-Binary/CesiumMan.glb"
          curl -fL --retry 3 -o godot/assets/props/ToyCar.glb "$BASE/ToyCar/glTF-Binary/ToyCar.glb"
          curl -fL --retry 3 -o godot/assets/props/Lantern.glb "$BASE/Lantern/glTF-Binary/Lantern.glb"
          test -s godot/assets/characters/CesiumMan.glb
          test -s godot/assets/props/ToyCar.glb
          test -s godot/assets/props/Lantern.glb
      - name: Installer Kenney City Kit Commercial (CC0, 16 vrais bâtiments)
        run: |
          curl -fL --retry 3 -o /tmp/kenney-city.zip https://kenney.nl/media/pages/assets/city-kit-commercial/a742d900eb-1753115042/kenney_city-kit-commercial_2.1.zip
          echo "f8b09b081c2bb88bcc126e2dec1cb40fd0dad7e7e591b6c26aaefe96fb35276b  /tmp/kenney-city.zip" | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          source=Path('/tmp/kenney-city.zip')
          destination=Path('godot/assets/kenney')
          destination.mkdir(parents=True,exist_ok=True)
          with ZipFile(source) as archive:
              glbs=[n for n in archive.namelist() if n.lower().endswith('.glb') and not n.startswith('__MACOSX')]
              glbs.sort(key=lambda n:(not bool(re.search(r'building|skyscraper|office|shop|store|commercial',Path(n).stem,re.I)),n))
              if len(glbs)<8:
                  raise RuntimeError(f'Pack Kenney sans modèles GLB suffisants: {len(glbs)}')
              for i,name in enumerate(glbs[:16]):
                  (destination/f'building_{i:02d}.glb').write_bytes(archive.read(name))
              print(f'Imported {min(16,len(glbs))} Kenney CC0 models')
          PY
      - name: Import Godot et validation du projet
        run: |
          set -e
          godot --headless --path godot --editor --import --quit
          godot --headless --path godot --quit-after 10
      - name: Export Godot Web pour Safari iPhone
        run: |
          mkdir -p web-build
          godot --headless --path godot --export-release Web ../web-build/index.html
          test -s web-build/index.html
          test -n "$(find web-build -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find web-build -maxdepth 1 -name '*.pck' -print -quit)"
      - name: Mettre en ligne sur GitHub Pages /play/
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p play
          find play -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a web-build/. play/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play
          if ! git diff --cached --quiet; then
            git commit -m "Publier build Godot Web pour iPhone [skip ci]"
            git push
          fi
      - name: Archiver le jeu web
        uses: actions/upload-artifact@v4
        with:
          name: metro-boulot-web
          path: web-build/
          retention-days: 7
